{% load i18n %}
{% load l10n %}
{% load url_utils %}
{% firstof canonical_url request.build_absolute_uri as schema_page_url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Place",
  "@id": "{{ schema_page_url|escapejs }}#place",
  "name": "{{ property_title_display|default:property.title|escapejs }}",
  "description": "{{ property_schema_description|default:property.short_description|default:property.description|striptags|truncatechars:400|escapejs }}",
  "url": "{{ schema_page_url|escapejs }}",
  "inLanguage": "{{ LANGUAGE_CODE|default:'ru'|escapejs }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ schema_page_url|escapejs }}"
  }
  {% if property_schema_image_urls %},
  "image": [{% for image_url in property_schema_image_urls %}"{{ image_url|absolute_url:request|escapejs }}"{% if not forloop.last %}, {% endif %}{% endfor %}]
  {% endif %}
  {% if property.year_built %},
  "yearBuilt": "{{ property.year_built }}"
  {% endif %}
  {% if property.address or property.location or property.district %},
  "address": {
    "@type": "PostalAddress",
    {% if property.address %}"streetAddress": "{{ property.address|escapejs }}"{% if property.location or property.district %}, {% endif %}{% endif %}
    {% with address_locality=property_location_label|default:property_district_label %}
    {% if address_locality %}"addressLocality": "{{ address_locality|escapejs }}",{% endif %}
    {% endwith %}
    "addressRegion": "{{ property_district_label|default:'Phuket'|escapejs }}",
    "addressCountry": "TH"
  }
  {% endif %}
  {% if property.latitude and property.longitude %},
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": {{ property.latitude|unlocalize }},
    "longitude": {{ property.longitude|unlocalize }}
  },
  "hasMap": "https://www.google.com/maps?q={{ property.latitude|unlocalize }},{{ property.longitude|unlocalize }}"
  {% endif %}
  {% if property.bedrooms or property.bathrooms or property.area_total or property.build_status %},
  "additionalProperty": [
    {% if property.bedrooms %}{
      "@type": "PropertyValue",
      "name": "{% trans "Количество спален" %}",
      "value": {{ property.bedrooms }}
    }{% if property.bathrooms or property.area_total or property.build_status %}, {% endif %}{% endif %}
    {% if property.bathrooms %}{
      "@type": "PropertyValue",
      "name": "{% trans "Количество ванных" %}",
      "value": {{ property.bathrooms }}
    }{% if property.area_total or property.build_status %}, {% endif %}{% endif %}
    {% if property.area_total %}{
      "@type": "PropertyValue",
      "name": "{% trans "Площадь" %}",
      "value": {{ property.area_total|unlocalize }},
      "unitCode": "MTK"
    }{% if property.build_status %}, {% endif %}{% endif %}
    {% if property.build_status %}{
      "@type": "PropertyValue",
      "name": "{% trans "Стадия готовности" %}",
      "value": "{{ property.get_build_status_display|escapejs }}"
    }{% endif %}
  ]
  {% endif %}
  {% if property.pool or property.parking or property.security or property.gym or property.furnished %},
  "amenityFeature": [
    {% if property.pool %}{
      "@type": "LocationFeatureSpecification",
      "name": "{% trans "Бассейн" %}",
      "value": true
    }{% if property.parking or property.security or property.gym or property.furnished %}, {% endif %}{% endif %}
    {% if property.parking %}{
      "@type": "LocationFeatureSpecification",
      "name": "{% trans "Парковка" %}",
      "value": true
    }{% if property.security or property.gym or property.furnished %}, {% endif %}{% endif %}
    {% if property.security %}{
      "@type": "LocationFeatureSpecification",
      "name": "{% trans "Охрана" %}",
      "value": true
    }{% if property.gym or property.furnished %}, {% endif %}{% endif %}
    {% if property.gym %}{
      "@type": "LocationFeatureSpecification",
      "name": "{% trans "Спортзал" %}",
      "value": true
    }{% if property.furnished %}, {% endif %}{% endif %}
    {% if property.furnished %}{
      "@type": "LocationFeatureSpecification",
      "name": "{% trans "С мебелью" %}",
      "value": true
    }{% endif %}
  ]
  {% endif %}
}
</script>
