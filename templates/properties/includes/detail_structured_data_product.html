{% load i18n %}
{% load l10n %}
{% load url_utils %}
{% firstof canonical_url request.build_absolute_uri as schema_page_url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "@id": "{{ schema_page_url|escapejs }}#product",
  "name": "{{ property_title_display|default:property.title|escapejs }}",
  "description": "{{ property_schema_description|default:property.short_description|default:property.description|striptags|truncatechars:400|escapejs }}",
  "url": "{{ schema_page_url|escapejs }}",
  "inLanguage": "{{ LANGUAGE_CODE|default:'ru'|escapejs }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ schema_page_url|escapejs }}"
  },
  {% if property.legacy_id %}
  "sku": "{{ property.legacy_id|escapejs }}",
  {% else %}
  "sku": "{{ property.slug|escapejs }}",
  {% endif %}
  {% if property.property_type %}
  "category": "{{ property.property_type.name_display|escapejs }}",
  {% endif %}
  "brand": {
    "@type": "Brand",
    "name": "Undersun Estate"
  },
  "additionalType": "{{ property.property_type|schema_additional_type }}",
  {% if property_schema_image_urls %}
  "image": [{% for image_url in property_schema_image_urls %}"{{ image_url|absolute_url:request|escapejs }}"{% if not forloop.last %}, {% endif %}{% endfor %}],
  {% endif %}
  {% if property.bedrooms or property.bathrooms or property.area_total or property.build_status or property.suitable_for %}
  "additionalProperty": [
    {% if property.bedrooms %}{
      "@type": "PropertyValue",
      "name": "{% trans "Количество спален" %}",
      "value": {{ property.bedrooms }}
    }{% if property.bathrooms or property.area_total or property.build_status or property.suitable_for %}, {% endif %}{% endif %}
    {% if property.bathrooms %}{
      "@type": "PropertyValue",
      "name": "{% trans "Количество ванных" %}",
      "value": {{ property.bathrooms }}
    }{% if property.area_total or property.build_status or property.suitable_for %}, {% endif %}{% endif %}
    {% if property.area_total %}{
      "@type": "PropertyValue",
      "name": "{% trans "Площадь" %}",
      "value": {{ property.area_total|unlocalize }},
      "unitCode": "MTK"
    }{% if property.build_status or property.suitable_for %}, {% endif %}{% endif %}
    {% if property.build_status %}{
      "@type": "PropertyValue",
      "name": "{% trans "Стадия готовности" %}",
      "value": "{{ property.get_build_status_display|escapejs }}"
    }{% if property.suitable_for %}, {% endif %}{% endif %}
    {% if property.suitable_for %}{
      "@type": "PropertyValue",
      "name": "{% trans "Подходит для" %}",
      "value": "{{ property.suitable_for|escapejs }}"
    }{% endif %}
  ],
  {% endif %}
  "offers": {
    "@type": "Offer",
    {% if final_price %}
    "priceCurrency": "THB",
    "price": "{{ final_price|unlocalize }}",
    {% endif %}
    "availability": "{% if property.status == 'available' %}https://schema.org/InStock{% else %}https://schema.org/OutOfStock{% endif %}",
    "url": "{{ schema_page_url|escapejs }}",
    "seller": {
      "@type": "Organization",
      "@id": "{{ request.scheme }}://{{ request.get_host }}/#real-estate-agent",
      "name": "Undersun Estate",
      "url": "{{ request.scheme }}://{{ request.get_host }}/"
    }
  }
}
</script>
