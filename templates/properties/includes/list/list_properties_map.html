{% load i18n %}

<!-- Properties Map -->
<div id="properties-map" class="hidden w-full h-[600px] bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden">
    <div class="map-status-toolbar">
        <div id="map-results-summary" class="map-results-summary hidden">
            <i class="fas fa-location-dot text-accent"></i>
            <span id="map-results-summary-text"></span>
        </div>
        <div class="map-toolbar-actions">
            <button id="map-refresh-button" type="button" class="map-toolbar-button">
                <i class="fas fa-rotate-right"></i>
                <span>{% trans "Обновить карту" %}</span>
            </button>
            <button id="map-reset-view-button" type="button" class="map-toolbar-button">
                <i class="fas fa-expand"></i>
                <span>{% trans "Сбросить обзор" %}</span>
            </button>
        </div>
    </div>
    <div class="map-legend" aria-label="{% trans 'Легенда карты' %}">
        <div class="map-legend-group">
            <span class="map-legend-group-label">{% trans "Тип" %}</span>
            <span class="map-legend-item">
                <span class="map-legend-icon condo"><i class="fas fa-building"></i></span>
                <span>{% trans "Квартиры" %}</span>
            </span>
            <span class="map-legend-item">
                <span class="map-legend-icon townhouse"><i class="fas fa-house"></i></span>
                <span>{% trans "Дома" %}</span>
            </span>
            <span class="map-legend-item">
                <span class="map-legend-icon villa"><i class="fas fa-landmark"></i></span>
                <span>{% trans "Виллы" %}</span>
            </span>
        </div>
        <div class="map-legend-group">
            <span class="map-legend-group-label">{% trans "Сделка" %}</span>
            <span class="map-legend-item">
                <span class="map-legend-dot sale"></span>
                <span>{% trans "Продажа" %}</span>
            </span>
            <span class="map-legend-item">
                <span class="map-legend-dot rent"></span>
                <span>{% trans "Аренда" %}</span>
            </span>
            <span class="map-legend-item">
                <span class="map-legend-dot both"></span>
                <span>{% trans "Продажа и аренда" %}</span>
            </span>
        </div>
    </div>
    <div id="map-status-overlay" class="map-status-overlay hidden" aria-live="polite">
        <div class="map-status-card">
            <div id="map-status-spinner" class="map-status-spinner hidden" aria-hidden="true"></div>
            <div id="map-status-icon" class="map-status-icon hidden">
                <i class="fas fa-map-location-dot"></i>
            </div>
            <h3 id="map-status-title" class="map-status-title"></h3>
            <p id="map-status-text" class="map-status-text"></p>
        </div>
    </div>
    <div id="map-container" class="w-full h-full"></div>
</div>
