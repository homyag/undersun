{% if catalog_faq.has_items %}
<section class="mt-12">
    <div class="relative overflow-hidden rounded-3xl border border-primary/10 bg-gradient-to-br from-white via-accent/5 to-primary/5 shadow-xl">
        <div class="absolute left-0 top-0 h-1.5 w-40 rounded-br-full bg-accent"></div>
        <div class="absolute -left-8 top-10 h-28 w-28 rounded-full bg-accent/10 blur-2xl"></div>
        <div class="absolute -right-10 bottom-0 h-36 w-36 rounded-full bg-primary/10 blur-3xl"></div>
        <div class="relative z-10 p-8 lg:p-10">
            <div class="max-w-3xl">
                <h2 class="text-3xl font-semibold leading-tight text-gray-900 lg:text-4xl">
                    {{ catalog_faq.heading }}
                </h2>
                <div class="mt-4 h-1 w-24 rounded-full bg-accent"></div>
            </div>
            <div class="mt-6 space-y-3">
                {% for faq in catalog_faq.entries %}
                    <div class="rounded-2xl border border-primary/10 bg-white/80 px-4 py-4 shadow-sm backdrop-blur-sm">
                        <div class="flex items-start gap-3">
                            <span class="mt-1 inline-flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-full bg-accent text-xs font-bold text-gray-900 shadow-sm">
                                <i class="fas fa-question"></i>
                            </span>
                            <div>
                                <h3 class="text-lg font-semibold text-gray-900">{{ faq.question }}</h3>
                                <p class="mt-2 leading-relaxed text-gray-700">{{ faq.answer }}</p>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
</section>
{% endif %}
