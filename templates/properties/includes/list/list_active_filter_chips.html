{% load i18n %}
{% if active_filter_chips %}
<div class="mb-4">
    <div class="mb-2 text-[11px] font-semibold uppercase tracking-[0.16em] text-gray-400">
        {% trans "Активные фильтры" %}
    </div>
    <div class="flex flex-wrap items-center gap-2">
        {% for chip in active_filter_chips %}
        <a href="{{ chip.remove_url }}"
           class="inline-flex items-center gap-2 rounded-full border border-gray-200 bg-white px-3 py-2 text-sm font-medium text-gray-700 shadow-sm transition-colors duration-200 hover:border-primary/25 hover:bg-primary/5 hover:text-primary"
           data-filter-chip="{{ chip.key }}"
           data-catalog-nav-link>
            <span>{{ chip.label }}</span>
            <span class="inline-flex h-5 w-5 items-center justify-center rounded-full bg-gray-100 text-xs text-gray-500 transition-colors duration-200">×</span>
        </a>
        {% endfor %}
        {% if active_filters_reset_url %}
        <a href="{{ active_filters_reset_url }}"
           class="inline-flex items-center gap-2 rounded-full border border-transparent px-3 py-2 text-sm font-semibold text-gray-500 transition-colors duration-200 hover:border-gray-200 hover:bg-white hover:text-primary"
           data-catalog-reset-link
           data-catalog-nav-link>
            <i class="fas fa-rotate-left text-xs"></i>
            <span>{% trans "Сбросить всё" %}</span>
        </a>
        {% endif %}
    </div>
</div>
{% endif %}
