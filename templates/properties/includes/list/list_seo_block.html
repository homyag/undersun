{% load i18n %}

{% if catalog_seo_block %}
<section class="mt-12">
    <div class="relative overflow-hidden rounded-3xl border border-primary/10 bg-gradient-to-br from-white via-accent/5 to-primary/5 shadow-xl">
        <div class="absolute left-0 top-0 h-1.5 w-40 rounded-br-full bg-accent"></div>
        <div class="absolute -left-8 top-10 h-28 w-28 rounded-full bg-accent/10 blur-2xl"></div>
        <div class="absolute -right-10 bottom-0 h-36 w-36 rounded-full bg-primary/10 blur-3xl"></div>
        <div class="relative z-10 flex flex-col gap-6 p-8 lg:p-10">
            {% if catalog_seo_block.title %}
                <div class="max-w-3xl">
                    <h2 class="text-3xl font-semibold leading-tight text-gray-900 lg:text-4xl">
                        {{ catalog_seo_block.title }}
                    </h2>
                    <div class="mt-4 h-1 w-24 rounded-full bg-accent"></div>
                </div>
            {% endif %}
            <div class="prose prose-lg max-w-none text-gray-700 prose-headings:text-gray-900 prose-p:leading-relaxed prose-strong:text-gray-900 prose-a:font-semibold prose-a:text-primary prose-a:no-underline prose-a:border-b prose-a:border-primary/25 hover:prose-a:border-accent prose-ul:space-y-2 prose-ul:pl-5 prose-li:marker:text-accent">
                {{ catalog_seo_block.content|safe }}
            </div>
        </div>
    </div>
</section>
{% endif %}
