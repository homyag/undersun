{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="utf-8">
  <title>{% trans "Проверка браузера" %}</title>
  <meta http-equiv="refresh" content="0;url={{ target_url }}">
  <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0c2032; color: #fff; font-family: sans-serif; }
    .box { text-align: center; max-width: 480px; padding: 32px; }
    .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #ffc107; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>{% trans "Проверяем браузер" %}</h1>
    <p>{% trans "Подождите пару секунд, мы проверяем Ваш браузер" %}</p>
    <p>{% trans "Если страница не обновится автоматически, нажмите" %} <a href="{{ target_url }}">{% trans "сюда" %}</a>.</p>
  </div>
  <script>
    (function() {
      const TOKEN_KEY = 'bot_challenge_token';
      const COOKIE_NAME = 'bot_challenge';
      function generateToken() {
        const data = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        return btoa(data).replace(/=/g, '');
      }
      function setCookie(name, value, days) {
        const expires = new Date(Date.now() + days * 86400000).toUTCString();
        document.cookie = `${name}=${value}; expires=${expires}; path=/`;
      }
      function getCookie(name) {
        const match = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
        return match ? match[1] : null;
      }
      function ensureToken() {
        let token = localStorage.getItem(TOKEN_KEY);
        const cookieToken = getCookie(COOKIE_NAME);

        if (cookieToken && token !== cookieToken) {
          token = cookieToken;
          localStorage.setItem(TOKEN_KEY, token);
        }

        if (!token) {
          token = generateToken();
          localStorage.setItem(TOKEN_KEY, token);
        }

        if (!cookieToken || cookieToken !== token) {
          setCookie(COOKIE_NAME, token, 7);
        }

        setTimeout(function() {
          window.location.href = '{{ target_url }}';
        }, 500);
      }
      ensureToken();
    })();
  </script>
</body>
</html>
