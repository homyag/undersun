{% load static i18n %}

<script>
// Inject Django URLs into JavaScript
window.djangoUrls = {
    mapPropertiesJson: "{% url 'properties:map_properties_json' %}",
    mapDistrictsJson: "{% url 'properties:map_districts_json' %}",
    mapProtomapsBasemapProxy: "{% url 'properties:map_protomaps_basemap_proxy' %}",
    getLocationsForDistrict: "{% url 'properties:get_locations_for_district' %}",
    ajaxSearchCount: "{% url 'properties:ajax_search_count' %}",
    staticImages: "{% static 'images/' %}",
    noImageSvg: "{% static 'images/no-image.svg' %}",
    mapStyleUrl: "https://tiles.openfreemap.org/styles/liberty"
};

window.mapConfig = {
    currentBasemap: "style-url",
    targetBasemap: "openfreemap-liberty",
    labelLanguage: "en",
    districtOverlayMode: "centroid-labels",
    vectorStyleUrl: "https://tiles.openfreemap.org/styles/liberty",
    protomapsEnabled: false,
    protomapsUrl: "",
    protomapsTheme: "light",
    enableHoverPopup: false,
    enableMarkerSpread: true,
    enablePropertyClusters: false,
    enableBoundsBasedLoading: true,
    boundsRefreshDebounceMs: 700,
    boundsPaddingRatio: 0.45
};

// Inject Django translations
{% with results=results_count_i18n %}
window.djangoTranslations = {
    favoriteAdded: "{% trans 'Добавлено в избранное' %}",
    favoriteRemoved: "{% trans 'Удалено из избранного' %}",
    whatsappText: "{% trans 'Здравствуйте! Меня интересует объект' %}",
    moreDetails: "{% trans 'Подробнее' %}",
    addToFavorites: "{% trans 'В избранное' %}",
    allLocations: "{% trans 'Все локации' %}",
    loadingLocations: "{% trans 'Загрузка локаций...' %}",
    noLocationsAvailable: "{% trans 'Локации не найдены' %}",
    loadingCatalog: "{% trans 'Обновляем каталог...' %}",
    priceOnRequest: "{% trans 'Цена по запросу' %}",
    mapLoadingTitle: "{% trans 'Загружаем карту' %}",
    mapLoadingText: "{% trans 'Подбираем объекты и расставляем маркеры на карте.' %}",
    mapEmptyTitle: "{% trans 'На карте пока нет объектов' %}",
    mapEmptyText: "{% trans 'Попробуйте смягчить фильтры или перейти к списку объектов.' %}",
    mapErrorTitle: "{% trans 'Не удалось обновить карту' %}",
    mapErrorText: "{% trans 'Проверьте фильтры или попробуйте обновить страницу.' %}",
    mapResultsSummary: "{% trans 'Объектов на карте' %}",
    mapRefreshLabel: "{% trans 'Обновить карту' %}",
    mapResetViewLabel: "{% trans 'Сбросить обзор' %}",
    saleLabel: "{% trans 'Продажа' %}",
    bedroomsShort: "{% trans 'спал.' %}",
    bathroomsShort: "{% trans 'ванн.' %}",
    areaShort: "{% trans 'м²' %}",
    resultsCount: {
        zero: "{{ results.zero|default_if_none:''|escapejs }}",
        one: "{{ results.one|default_if_none:''|escapejs }}",
        few: "{{ results.few|default_if_none:''|escapejs }}",
        many: "{{ results.many|default_if_none:''|escapejs }}"
    }
};
{% endwith %}
</script>
