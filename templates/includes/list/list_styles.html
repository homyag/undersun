<!-- List Page Styles -->
{% load static %}
<style>
    .properties-container {
        position: relative;
    }

    .loading-overlay {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 30;
        align-items: flex-start;
        justify-content: center;
        padding: 4rem 1.5rem 1.5rem;
        border-radius: 1rem;
        background: rgba(249, 250, 251, 0.82);
        backdrop-filter: blur(3px);
    }

    .properties-container.loading .loading-overlay {
        display: flex;
    }

    .loading-overlay-panel {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.85rem 1.1rem;
        border: 1px solid rgba(209, 213, 219, 0.9);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
    }

    .loading-overlay-text {
        color: #4b5563;
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.2;
    }

    .spinner {
        width: 1.25rem;
        height: 1.25rem;
        flex: 0 0 auto;
        border: 2px solid var(--primary-color, #474B57);
        border-top-color: transparent;
        border-radius: 999px;
        animation: catalog-spin 1s linear infinite;
    }

    @keyframes catalog-spin {
        to {
            transform: rotate(360deg);
        }
    }

    #filters-sidebar.mobile-open {
        display: block;
    }

    .view-toggle-btn--active {
        background: #fff;
        color: var(--primary-color, #474B57);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
</style>
<link rel="preload" as="style"
      href="{% static 'css/list/list_styles.css' %}"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript>
    <link rel="stylesheet" href="{% static 'css/list/list_styles.css' %}">
</noscript>
