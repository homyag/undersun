{% load static %}

<!-- Inject Django data for JavaScript -->
{% include 'includes/list/list_data_injection.html' %}

<!-- Django i18n catalog for JavaScript (fails gracefully if route is missing) -->
{% url 'javascript-catalog' as js_catalog_url %}
{% if js_catalog_url %}
<script src="{{ js_catalog_url }}"></script>
{% endif %}

<!-- MapLibre GL JavaScript -->
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@protomaps/basemaps@5/dist/basemaps.js" crossorigin="anonymous"></script>

<!-- List JavaScript Files -->
<script src="{% static 'js/list/list_utility_functions.js' %}"></script>
<script src="{% static 'js/map/map_popups.js' %}"></script>
<script src="{% static 'js/map/map_core.js' %}"></script>
<script src="{% static 'js/list/list_map_functions.js' %}"></script>
<script src="{% static 'js/list/list_map_data_loader.js' %}"></script>
<script src="{% static 'js/list/list_view_toggle.js' %}"></script>
<script src="{% static 'js/list/list_favorites.js' %}"></script>
<script src="{% static 'js/list/list_main_init.js' %}"></script>
